HelpTitle="Voice Compressor — Help"
GuideIntro="This compressor turns down loud sounds to make levels more even. It does not automatically boost only quiet sounds."
GuideStep1="1. Choose Natural voice, then open the live meter."
GuideStep2="2. Play audio and lower Compression threshold. Aim for about 3–6 dB of gain reduction on louder sounds."
GuideStep3="3. If the result is too quiet, increase Processed volume a little. Keep the output below 0 dBFS."
GuideStep4="4. Use the eye icon in OBS to compare the effect on and off. Leave the other settings at their preset values to start."
GuideMeters="Meters: Input = before processing; Output = after processing; Gain reduction = how much the sound is turned down. This is not a peak limiter."
GuideMore="Hover over a setting for an explanation. If the meters do not move, check that the selected audio source is receiving sound in OBS."
ThresholdHint="Threshold: compression starts above this level. Lower, more negative values compress quieter sounds too."
RatioHint="Ratio: higher values reduce loud sounds more. At 4:1, a level 4 dB above the threshold is reduced to about 1 dB above it."
AttackHint="Attack: lower values react faster to sudden loud sounds. Higher values preserve more of the start of each sound."
ReleaseHint="Release: lower values restore volume sooner. Higher values let the volume recover more slowly."
KneeHint="Soft knee: higher values make compression begin more gradually. At 0, compression starts at a sharp boundary."
MakeupHint="Makeup gain: raises or lowers the processed sound only. Too much gain can cause clipping. The original signal is unchanged."
MixHint="100% is processed sound only; 0% is the original sound. Values in between blend the two."
HighpassHint="Detector high-pass: higher values make low bass trigger less compression. This does not remove bass from the audible signal. Set to 0 to turn off."

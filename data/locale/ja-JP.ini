HelpTitle="Voice Compressor — 使い方"
GuideIntro="この機能は、大きな音を抑えて聞き取りやすくします。小さな音だけを自動で大きくする機能ではありません。"
GuideStep1="①「自然な声」を押し、「ライブメーターを開く」を押します。"
GuideStep2="② 音を出しながら「圧縮を始める音量」を下げます。大きな音で圧縮量が3～6 dBになる程度が目安です。"
GuideStep3="③ 小さくなりすぎたら「処理後の音量」を少し上げます。出力が0 dBFSに達しないようにします。"
GuideStep4="④ OBSの目のアイコンで効果を切り替えて聴き比べます。その他の設定は、最初はそのままで大丈夫です。"
GuideMeters="メーター：入力＝処理前、出力＝処理後、圧縮量＝どれだけ音を抑えたか。これは最大音量を完全に制限する機能ではありません。"
GuideMore="各設定にマウスを重ねると詳しい説明が出ます。メーターが動かない場合は、OBSで対象の音声が入力されているか確認してください。"
ThresholdHint="スレッショルド：この音量を超えると圧縮します。数値を下げる（よりマイナスにする）ほど、小さな音から圧縮がかかります。"
RatioHint="レシオ：数値が大きいほど強く抑えます。4:1なら、しきい値を4 dB超えた分を約1 dBに抑えます。"
AttackHint="アタック：小さい数値ほど、急な大きい音を素早く抑えます。大きい数値では音の出だしを残します。"
ReleaseHint="リリース：小さい数値ほど早く音量が戻ります。大きい数値ほどゆっくり戻ります。"
KneeHint="ソフトニー：数値が大きいほど、圧縮が徐々にかかります。0では境目ではっきり切り替わります。"
MakeupHint="出力ゲイン：圧縮した音を上げ下げします。上げすぎると音が割れる場合があります。原音側の音量は変わりません。"
MixHint="100%は圧縮した音のみ、0%は原音のみです。途中の値では両方を混ぜます。"
HighpassHint="検出用ハイパス：数値を上げると、低音で圧縮がかかりにくくなります。実際の音から低音を削る設定ではありません。0で無効です。"

HelpTitle="Voice Compressor — 使用說明"
GuideIntro="壓縮器會壓低較大的聲音，讓音量更均勻。它不會只把小聲的部分自動放大。"
GuideStep1="① 選擇「自然人聲」，然後開啟即時電平表。"
GuideStep2="② 播放聲音，同時降低「開始壓縮的音量」。較大聲音的增益衰減約為3～6 dB即可作為起點。"
GuideStep3="③ 如果聲音太小，稍微提高「處理後的音量」。保持輸出低於0 dBFS。"
GuideStep4="④ 按OBS的眼睛圖示，比較開啟與關閉的效果。初次使用時，其他參數維持預設值即可。"
GuideMeters="電平表：輸入＝處理前；輸出＝處理後；增益衰減＝聲音被壓低了多少。此功能無法完全限制瞬間的最大音量。"
GuideMore="將滑鼠停在設定項目上可查看詳細說明。如果電平表不動，請確認OBS中的目標音源正在接收聲音。"
ThresholdHint="閾值：超過此音量時開始壓縮。數值越低（負值越大），越小的聲音也會被壓縮。"
RatioHint="壓縮比：數值越大，壓低效果越強。4:1表示超過閾值4 dB的部分被壓到約1 dB。"
AttackHint="啟動時間：數值越小，越快壓低突然出現的大聲。數值越大，越能保留聲音的起始部分。"
ReleaseHint="釋放時間：數值越小，越快恢復原來的音量；數值越大，恢復越慢。"
KneeHint="軟轉折：數值越大，壓縮開始得越平滑。0表示到達閾值時直接開始壓縮。"
MakeupHint="輸出增益：只調整處理後聲音的音量。提高過多可能導致失真，不改變原音部分的音量。"
MixHint="100%為處理後的聲音，0%為原音。中間值會混合兩者。"
HighpassHint="偵測高通：數值越大，低音越不容易觸發壓縮。不會從實際聲音中去除低音，0為關閉。"

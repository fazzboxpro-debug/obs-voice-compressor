HelpButton="使用帮助（新手指南）"
HelpTitle="Voice Compressor — 使用帮助"
GuideIntro="压缩器会压低较大的声音，让音量更均匀。它不会只把小声的部分自动放大。"
GuideStep1="① 选择“自然人声”，然后打开实时电平表。"
GuideStep2="② 播放声音，同时降低“开始压缩的音量”。较大声音的增益衰减约为3～6 dB即可作为起点。"
GuideStep3="③ 如果声音太小，稍微提高“处理后的音量”。保持输出低于0 dBFS。"
GuideStep4="④ 点击OBS的眼睛图标，比较开启和关闭的效果。初次使用时，其他参数保持预设值即可。"
GuideMeters="电平表：输入＝处理前；输出＝处理后；增益衰减＝声音被压低了多少。此功能不能完全限制瞬间的最大音量。"
GuideMore="把鼠标停在设置项上可查看详细说明。如果电平表不动，请确认OBS中的目标音源正在接收声音。"
ThresholdHint="阈值：超过此音量时开始压缩。数值越低（负值越大），越小的声音也会被压缩。"
RatioHint="压缩比：数值越大，压低效果越强。4:1表示超过阈值4 dB的部分被压到约1 dB。"
AttackHint="启动时间：数值越小，越快压低突然出现的大声。数值越大，越能保留声音的起始部分。"
ReleaseHint="释放时间：数值越小，越快恢复原来的音量；数值越大，恢复越慢。"
KneeHint="软拐点：数值越大，压缩开始得越平滑。0表示到达阈值时直接开始压缩。"
MakeupHint="输出增益：只调整处理后声音的音量。提高过多可能导致失真，不改变原声部分的音量。"
MixHint="100%为处理后的声音，0%为原声。中间值会混合两者。"
HighpassHint="检测高通：数值越大，低音越不容易触发压缩。不会从实际声音中去除低音，0为关闭。"
